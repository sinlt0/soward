{% macro icon(name) -%}
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "shield" %}<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == "lock" %}<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>
{%- elif name == "radar" %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l5-5"/>
{%- elif name == "badge" %}<circle cx="12" cy="9" r="5"/><path d="M9 13.5L8 21l4-2 4 2-1-7.5"/>
{%- elif name == "tag" %}<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.2"/>
{%- elif name == "gavel" %}<path d="M14 4l6 6M12 6l6 6-3 3-6-6 3-3zM9 12l-6 6 3 3 6-6"/>
{%- elif name == "scroll" %}<path d="M7 4h11v13a3 3 0 01-3 3H6a2 2 0 01-2-2v-1h8v1"/><path d="M7 4a2 2 0 00-2 2v10h7"/><path d="M10 8h5M10 11h5"/>
{%- elif name == "chart" %}<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif name == "wave" %}<path d="M3 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/><path d="M3 18c2-4 4-4 6 0s4 4 6 0 4-4 6 0" opacity=".5"/>
{%- elif name == "ticket" %}<path d="M3 8a2 2 0 002-2h14a2 2 0 002 2v2a2 2 0 000 4v2a2 2 0 00-2 2H5a2 2 0 00-2-2v-2a2 2 0 000-4V8z"/><path d="M14 6v12" stroke-dasharray="2 2"/>
{%- elif name == "gift" %}<rect x="3" y="9" width="18" height="12" rx="1"/><path d="M12 9v12M3 13h18M12 9c-3 0-5-1-5-3s3-3 5 0c2-3 5-2 5 0s-2 3-5 3z"/>
{%- elif name == "mouse" %}<rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 7v4"/>
{%- elif name == "terminal" %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 10l3 2-3 2M13 15h4"/>
{%- elif name == "bell" %}<path d="M6 16V11a6 6 0 0112 0v5l2 2H4l2-2z"/><path d="M10 21h4"/>
{%- elif name == "music" %}<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
{%- elif name == "spark" %}<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z"/>
{%- elif name == "wrench" %}<path d="M14 6a4 4 0 005 5l-9 9a2.5 2.5 0 01-3.5-3.5l9-9a4 4 0 00-1.5-1.5z"/>
{%- elif name == "eye" %}<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == "search" %}<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
{%- else %}<circle cx="12" cy="12" r="8"/>{%- endif %}
</svg>
{%- endmacro %}
