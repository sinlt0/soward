{% extends "base.html" %}
{% block title %}{{ doc.title }} · {{ bot_name }}{% endblock %}
{% block description %}{{ doc.description }}{% endblock %}
{% block content %}
<div class="wrap" style="padding-top:36px">
  <div class="docs">
    <nav class="docs__nav" aria-label="Docs">
      {% for d in docs %}
      <a href="{{ url_for('doc_page', slug=d.slug) }}"{% if d.slug == doc.slug %} aria-current="page"{% endif %}>{{ d.title }}</a>
      {% endfor %}
    </nav>
    <article class="prose">
      <h1>{{ doc.title }}</h1>
      {{ html }}
    </article>
  </div>
</div>
{% endblock %}
