<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soward Music</title>
<link rel="stylesheet" href="app.css?v={{ build }}">
</head>
<body data-client-id="{{ client_id }}" data-build="{{ build }}" data-music="{{ '1' if music else '0' }}" data-games="{{ games }}" data-enabled="{{ '1' if enabled else '0' }}">
<div id="app"><div class="boot">Loading Soward Music…</div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<audio id="audio" preload="auto"></audio>
<script src="discord.js?v={{ build }}"></script>
<script src="games.js?v={{ build }}"></script>
<script src="doom.js?v={{ build }}"></script>
<script src="app.js?v={{ build }}"></script>
</body>
</html>
