services:
  - type: web
    name: soward-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: ZYRO_TOKEN
        sync: false
      - key: ZYRO_MONGO_URI
        sync: false
      - key: ZYRO_MONGO_DB
        sync: false
      - key: ZYRO_LAVALINK_HOST
        sync: false
      - key: ZYRO_LAVALINK_PORT
        sync: false
      - key: ZYRO_LAVALINK_PASSWORD
        sync: false
      - key: ZYRO_LAVALINK_SECURE
        sync: false
      - key: ZYRO_WEBSUB
        value: "1"
      - key: ZYRO_WEBSUB_SECRET
        generateValue: true
      - key: ZYRO_YOUTUBE_API_KEY
        sync: false
      - key: ZYRO_TWITCH_CLIENT_ID
        sync: false
      - key: ZYRO_TWITCH_CLIENT_SECRET
        sync: false
      - key: ZYRO_DEV_LOG_COMMANDS_WEBHOOK
        sync: false
      - key: ZYRO_DEV_LOG_LIFECYCLE_WEBHOOK
        sync: false
      - key: ZYRO_DEV_LOG_ERRORS_WEBHOOK
        sync: false
      - key: ZYRO_DEV_LOG_GUILDS_WEBHOOK
        sync: false
      - key: ZYRO_DEV_STATS_WEBHOOK
        sync: false
      - key: ZYRO_CLIENT_ID
        sync: false
      - key: ZYRO_CLIENT_SECRET
        sync: false
      - key: ZYRO_DASHBOARD_URL
        sync: false
      - key: ZYRO_SESSION_SECRET
        generateValue: true
      - key: ZYRO_IP_SALT
        generateValue: true
      - key: ZYRO_BEHIND_PROXY
        value: "1"
      - key: ZYRO_IPINTEL_PROVIDER
        value: none
      - key: ZYRO_IPINTEL_KEY
        sync: false
      - key: ZYRO_SUPPORT_URL
        sync: false
      - key: PORT
        value: 8080
